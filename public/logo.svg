<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="120" x2="432" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Network lines (connections between devices) -->
  <g stroke="url(#accent)" stroke-width="3" opacity="0.35" filter="url(#softGlow)">
    <line x1="256" y1="180" x2="130" y2="290"/>
    <line x1="256" y1="180" x2="382" y2="290"/>
    <line x1="130" y1="290" x2="382" y2="290"/>
    <line x1="256" y1="180" x2="256" y2="370"/>
    <line x1="130" y1="290" x2="256" y2="370"/>
    <line x1="382" y1="290" x2="256" y2="370"/>
  </g>

  <!-- Animated-style data flow dots on lines -->
  <g fill="#22d3ee" opacity="0.6">
    <circle cx="193" cy="235" r="4"/>
    <circle cx="319" cy="235" r="4"/>
    <circle cx="193" cy="330" r="3.5"/>
    <circle cx="319" cy="330" r="3.5"/>
    <circle cx="256" cy="275" r="3.5"/>
  </g>

  <!-- Top node (central hub) -->
  <g filter="url(#glow)">
    <circle cx="256" cy="180" r="32" fill="url(#nodeGrad)" opacity="0.9"/>
    <circle cx="256" cy="180" r="18" fill="#0f172a"/>
    <!-- Upload/share icon inside -->
    <path d="M256 172 L264 180 L258 180 L258 188 L254 188 L254 180 L248 180 Z" fill="#22d3ee" stroke="none"/>
  </g>

  <!-- Bottom-left node (device) -->
  <g filter="url(#softGlow)">
    <circle cx="130" cy="290" r="26" fill="#10b981" opacity="0.8"/>
    <circle cx="130" cy="290" r="14" fill="#0f172a"/>
    <!-- Monitor icon -->
    <rect x="123" y="285" width="14" height="10" rx="1.5" fill="none" stroke="#10b981" stroke-width="1.8"/>
    <line x1="130" y1="295" x2="130" y2="298" stroke="#10b981" stroke-width="1.8"/>
    <line x1="125" y1="298" x2="135" y2="298" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Bottom-right node (device) -->
  <g filter="url(#softGlow)">
    <circle cx="382" cy="290" r="26" fill="#10b981" opacity="0.8"/>
    <circle cx="382" cy="290" r="14" fill="#0f172a"/>
    <!-- Phone icon -->
    <rect x="377" y="283" width="10" height="14" rx="2" fill="none" stroke="#10b981" stroke-width="1.8"/>
    <circle cx="382" cy="294" r="1.2" fill="#10b981"/>
  </g>

  <!-- Bottom center node (device) -->
  <g filter="url(#softGlow)">
    <circle cx="256" cy="370" r="26" fill="#10b981" opacity="0.8"/>
    <circle cx="256" cy="370" r="14" fill="#0f172a"/>
    <!-- Laptop icon -->
    <rect x="248" y="363" width="16" height="10" rx="1.5" fill="none" stroke="#10b981" stroke-width="1.8"/>
    <line x1="244" y1="376" x2="268" y2="376" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Text: NEXLAN -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" letter-spacing="6" fill="url(#accent)">NEXLAN</text>

  <!-- Subtle tagline -->
  <text x="256" y="466" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" letter-spacing="3" fill="#64748b">LOCAL FILE SHARING</text>
</svg>
